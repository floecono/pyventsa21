[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyventsa21"
version = "0.2.0"
description = "Control ventilation units with the VENTS A21 controller over Modbus TCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Florent Iermann (Econology)" }]
keywords = ["vents", "a21", "modbus", "ventilation", "mvhr", "hrv", "econoprime", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/floecono/pyventsa21"
Issues = "https://github.com/floecono/pyventsa21/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyventsa21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
files = ["src"]
